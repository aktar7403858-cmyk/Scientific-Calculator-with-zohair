<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scientific Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calculator">
    <header>
      <h1>Scientific Calculator</h1>
      <p>Simple, clean, and ready for your assignment</p>
    </header>

    <label class="mode">
      <input type="checkbox" id="angleMode">
      <span>Use degrees (unchecked = radians)</span>
    </label>

    <input id="display" class="display" type="text" inputmode="decimal"
      aria-label="Calculator display" placeholder="0" autocomplete="off" readonly>

    <section class="keys" aria-label="Calculator keys">
      <button class="function" data-action="clear">AC</button>
      <button class="function" data-action="delete">DEL</button>
      <button class="function" data-value="(">(</button>
      <button class="function" data-value=")">)</button>
      <button class="operator" data-value="/">÷</button>

      <button data-value="sin(">sin</button>
      <button data-value="cos(">cos</button>
      <button data-value="tan(">tan</button>
      <button data-value="sqrt(">√</button>
      <button class="operator" data-value="*">×</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button data-value="^">xʸ</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button data-value="log(">log</button>
      <button class="operator" data-value="+">+</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="ln(">ln</button>
      <button data-value="!">x!</button>

      <button data-value="0">0</button>
      <button data-value=".">.</button>
      <button data-value="pi">π</button>
      <button data-value="e">e</button>
      <button class="equals" data-action="equals">=</button>

      <button class="function" data-value="abs(">abs</button>
      <button class="function" data-value="exp(">exp</button>
      <button class="function" data-value="Ans">Ans</button>
      <button class="function" data-value="%">%</button>
      <button class="function" data-action="sign">±</button>
    </section>
    <p id="message" class="message" role="status"></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
